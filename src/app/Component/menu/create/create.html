<div class="inner-scroll-wrapper">
  <div class="container py-4">
    <div class="card shadow p-4">
      <h3 class="mb-4 text-center">Create Menu Item</h3>

      <form [formGroup]="menuForm" (ngSubmit)="onSubmit()">

        <!-- Name -->
        <div class="mb-3">
          <label class="form-label">Menu Name</label>
          <input type="text" class="form-control" formControlName="name" placeholder="Enter menu name">

          <div class="text-danger mt-1" *ngIf="menuForm.get('name')?.touched && menuForm.get('name')?.invalid">
            Name is required
          </div>
        </div>

        <!-- Price -->
        <div class="mb-3">
          <label class="form-label">Price</label>
          <input type="number" class="form-control" formControlName="price" placeholder="Enter price">

          <div class="text-danger mt-1" *ngIf="menuForm.get('price')?.touched && menuForm.get('price')?.invalid">
            Price must be greater than 0
          </div>
        </div>

        <!-- Description -->
        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea class="form-control" formControlName="description" rows="3" placeholder="Enter description">
        </textarea>
        </div>

        <div class="mb-3">
          <label class="form-label">Menu Image</label>
          <input type="file" class="form-control" (change)="onImageSelected($event)" accept="image/*">
        </div>

        <!-- Category Id -->
        <div class="mb-3">
          <label class="form-label">Category Id</label>
          <input type="number" class="form-control" formControlName="categoryId" placeholder="Enter category id">

          <div class="text-danger mt-1"
            *ngIf="menuForm.get('categoryId')?.touched && menuForm.get('categoryId')?.invalid">
            Category is required
          </div>
        </div>

        <!-- Is Valid -->
        <div class="form-check mb-3">
          <input type="checkbox" class="form-check-input" formControlName="isvalid" id="isvalidCheck">
          <label class="form-check-label" for="isvalidCheck">
            Is Active
          </label>
        </div>

        <!-- Submit Button -->
        <div class="text-center">
          <button type="submit" class="btn btn-primary px-4" [disabled]="menuForm.invalid">
            Save Menu
          </button>
        </div>

      </form>
    </div>
  </div>
