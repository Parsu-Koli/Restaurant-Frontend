<div class="page-scroll-container" *ngIf="menuItem as item">

  <div class="container py-5 d-flex justify-content-center">

    <div class="menu-wrapper">

      <div class="card border-0 shadow-lg rounded-4 overflow-hidden menu-card">

        <!-- Image Section -->
        <div class="image-wrapper">
          <img [src]="'https://localhost:44398' + item.imageUrl" class="menu-img" alt="Food Image" />

          <span class="badge position-absolute top-0 end-0 m-3 px-3 py-2 fs-6"
            [ngClass]="item.isAvailable ? 'bg-success' : 'bg-danger'">
            {{ item.isAvailable ? 'Available' : 'Out of Stock' }}
          </span>
        </div>

        <div class="card-body p-4 d-flex flex-column">

          <h2 class="text-center fw-bold text-dark mb-3">
            {{ item.name }}
          </h2>

          <p class="text-muted text-center mb-4">
            {{ item.description }}
          </p>

          <div class="text-center mb-4">
            <span class="badge bg-success fs-4 px-4 py-2 rounded-pill shadow-sm">
              ₹ {{ item.price }}
            </span>
          </div>

          <div class="d-grid gap-2 mt-auto">

            <button class="btn btn-success btn-lg rounded-pill">
              🛒 Add to Order
            </button>

            <div class="d-flex gap-2">
              <button class="btn btn-outline-warning w-50 rounded-pill" (click)="goToUpdate(item.id)">
                ✏ Update
              </button>

              <button class="btn btn-outline-danger w-50 rounded-pill" (click)="deleteMenuItem(item.id)">
                🗑 Delete
              </button>
            </div>

            <button class="btn btn-outline-secondary rounded-pill" routerLink="/menu">
              ← Back to Menu
            </button>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>
