<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-lg border-0 p-4 update-card">

                <h2 class="text-center text-warning mb-4">
                    ✏️ Update Menu Item
                </h2>

                <form [formGroup]="updateForm" (ngSubmit)="onSubmit()">

                    <div class="mb-3">
                        <label class="form-label">Item Name</label>
                        <input type="text" class="form-control" formControlName="name">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" rows="3" formControlName="description"></textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Price (₹)</label>
                        <input type="number" class="form-control" formControlName="price">
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Category ID</label>
                        <input type="number" class="form-control" formControlName="categoryId">
                    </div>

                    <div class="d-flex justify-content-between">

                        <button type="submit" class="btn btn-warning px-4">
                            Update
                        </button>

                        <button type="button" class="btn btn-outline-secondary px-4" (click)="goBack()">
                            Cancel
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>
