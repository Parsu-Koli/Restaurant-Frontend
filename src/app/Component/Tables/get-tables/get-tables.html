<div class="container mt-5">

  <!-- Page Title -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold mb-0 bi bi-grid-3x3-gap-fill fs-3 text-primary me-2">Tables List</h2>

    <a routerLink="/add-table" class="btn btn-primary">
      <i class="bi bi-pencil me-2"></i>
      Add Table
    </a>
  </div>

  <!-- Scrollable Table Wrapper -->
  <div class="table-container p-3">

    <table class="table align-middle table-hover mb-0">

      <thead class="table-light sticky-header">
        <tr>
          <th><i class="bi bi-hash me-1"></i> Table ID</th>
          <th><i class="bi bi-123 me-1"></i> Table Number</th>
          <th><i class="bi bi-people-fill me-1"></i> Capacity</th>
          <th><i class="bi bi-geo-alt-fill me-1"></i> Location</th>
          <th><i class="bi bi-info-circle-fill me-1"></i> Status</th>
          <th><i class="bi bi-activity"></i>Action</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let table of tables">

          <td class="fw-semibold">{{ table.tableId }}</td>

          <td>{{ table.tableNumber }}</td>

          <td>
            <span class="badge bg-secondary">
              {{ table.capacity }} Seats
            </span>
          </td>

          <td>{{ table.locationZone }}</td>

          <td>
            <span class="badge px-3 py-2 rounded-pill" [ngClass]="{
                    'bg-success': table.status === 'Available',
                    'bg-danger': table.status === 'Occupied',
                    'bg-warning text-dark': table.status === 'Reserved'
                  }">
              {{ table.status }}
            </span>
          </td>
          <td class="text-center">
            <a [routerLink]="['/getOrderbytable', table.tableId]"
              class="btn btn-sm btn-outline-primary rounded-pill px-3">
              <i class="bi bi-eye me-1"></i> View
            </a>
          </td>
        </tr>
      </tbody>

    </table>

  </div>

</div>
