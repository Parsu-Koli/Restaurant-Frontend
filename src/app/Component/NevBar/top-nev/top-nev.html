<nav class="navbar navbar-expand-lg bg-white shadow-sm px-4 py-3 dashboard-navbar">

  <!-- Left Section -->
  <div class="d-flex align-items-center gap-3">

    

    <h5 class="mb-0 fw-semibold text-dark">
      Dashboard
    </h5>

  </div>

  <!-- Right Section -->
  <div class="d-flex align-items-center gap-4 ms-auto">

    <!-- Date -->
    <div class="d-flex align-items-center text-muted gap-2 small">
      <i class="bi bi-calendar-event"></i>
      <span>{{ todayDate | date:'MMM dd, yyyy' }}</span>
    </div>

    <!-- Notification -->
    <div *ngIf="isLoggedIn" class="position-relative notification-icon">
      <i class="bi bi-bell fs-5 text-dark"></i>

      <span *ngIf="notificationCount > 0" class="notification-badge">
        {{ notificationCount }}
      </span>
    </div>

    <!-- LOGIN BUTTON -->
    <button *ngIf="!isLoggedIn"
            class="btn btn-primary rounded-pill px-4"
            (click)="goToLogin()">

      <i class="bi bi-box-arrow-in-right me-2"></i>
      Login

    </button>

    <!-- USER DROPDOWN -->
    <div *ngIf="isLoggedIn" class="dropdown">

      <button class="btn btn-light border dropdown-toggle rounded-pill px-3"
              data-bs-toggle="dropdown">

        <i class="bi bi-person-circle me-2"></i>
        {{ userName }}

      </button>

      <ul class="dropdown-menu dropdown-menu-end shadow border-0 rounded-3">

        <li>
          <a class="dropdown-item py-2">
            <i class="bi bi-person me-2"></i>
            Profile
          </a>
        </li>

        <li>
          <hr class="dropdown-divider">
        </li>

        <li>
          <a class="dropdown-item py-2 text-danger"
             (click)="logout()">

            <i class="bi bi-box-arrow-right me-2"></i>
            Logout

          </a>
        </li>

      </ul>

    </div>

  </div>

</nav>
